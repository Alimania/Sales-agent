<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ایجنت فروش — پنل مدیریت</title>
<style>
  :root{--bg:#0f1117;--card:#171a23;--card2:#1e2230;--line:#2a2f3f;--txt:#e6e8ee;--muted:#8b93a7;--accent:#4f8cff;--ok:#22c55e;--warn:#f59e0b;--danger:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--txt)}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:10;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:700}
  nav{display:flex;gap:6px;flex-wrap:wrap}
  nav button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px}
  nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  main{padding:20px;max-width:1300px;margin:0 auto}
  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card .label{color:var(--muted);font-size:12px;margin-bottom:8px}
  .card .value{font-size:22px;font-weight:700}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:right;padding:10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:12px}
  input,textarea,select{background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:10px 12px;border-radius:10px;font-family:inherit;font-size:13px;width:100%}
  textarea{resize:vertical;min-height:70px}
  button.primary{background:var(--accent);border:none;color:#fff;padding:10px 18px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:12px}
  button.danger{background:transparent;border:1px solid var(--danger);color:var(--danger);padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px}
  .b-ok{background:rgba(34,197,94,.15);color:var(--ok)}
  .b-warn{background:rgba(245,158,11,.15);color:var(--warn)}
  .b-info{background:rgba(79,140,255,.15);color:var(--accent)}
  .b-mut{background:rgba(139,147,167,.15);color:var(--muted)}
  .chat-wrap{display:grid;grid-template-columns:300px 1fr;gap:14px;min-height:70vh}
  @media(max-width:820px){.chat-wrap{grid-template-columns:1fr}}
  .conv-list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:75vh}
  .conv{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .conv:hover{background:var(--card2)}
  .conv.active{background:rgba(79,140,255,.12)}
  .conv .n{font-size:13px;font-weight:600}
  .conv .s{font-size:11px;color:var(--muted);margin-top:4px}
  .thread{background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;max-height:75vh}
  .msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:75%;padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.7;white-space:pre-wrap}
  .msg.user{align-self:flex-start;background:var(--card2)}
  .msg.agent{align-self:flex-end;background:rgba(79,140,255,.18)}
  .msg.human{align-self:flex-end;background:rgba(34,197,94,.16)}
  .composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  .composer input{flex:1}
  .empty{color:var(--muted);text-align:center;padding:40px;font-size:13px}
  h3{font-size:14px;margin:0 0 14px}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>🤖 ایجنت فروش</h1>
  <nav>
    <button data-tab="dash" class="active">داشبورد</button>
    <button data-tab="chats">گفتگوها</button>
    <button data-tab="products">محصولات</button>
    <button data-tab="orders">سفارش‌ها</button>
    <button data-tab="settings">تنظیمات</button>
  </nav>
</header>

<main>
  <section id="tab-dash">
    <div class="grid cards" id="statCards"></div>
    <div class="card" style="margin-top:14px">
      <h3>🧪 تست ایجنت (بدون تلگرام)</h3>
      <div class="composer" style="border:none;padding:0">
        <input id="simInput" placeholder="مثلاً: قیمت شال نخی چنده؟" onkeydown="if(event.key==='Enter')simulate()" />
        <button class="primary" onclick="simulate()">ارسال</button>
      </div>
      <div id="simOut" style="margin-top:14px;font-size:13px;line-height:1.9;color:var(--muted);white-space:pre-wrap"></div>
    </div>
  </section>

  <section id="tab-chats" class="hidden">
    <div class="chat-wrap">
      <div class="conv-list" id="convList"></div>
      <div class="thread">
        <div class="msgs" id="threadMsgs"><div class="empty">یک گفتگو را انتخاب کن</div></div>
        <div class="composer">
          <input id="replyInput" placeholder="پاسخ انسانی..." onkeydown="if(event.key==='Enter')sendReply()" />
          <button class="primary" onclick="sendReply()">ارسال</button>
          <button class="ghost" onclick="toggleHandoff()">پشتیبان</button>
        </div>
      </div>
    </div>
  </section>

  <section id="tab-products" class="hidden">
    <div class="card">
      <h3>➕ محصول جدید</h3>
      <div class="form-grid">
        <div><label>نام</label><input id="pName" /></div>
        <div><label>دسته</label><input id="pCat" /></div>
        <div><label>قیمت (تومان)</label><input id="pPrice" type="number" /></div>
        <div><label>موجودی</label><input id="pStock" type="number" /></div>
        <div><label>برچسب‌ها (با کاما)</label><input id="pTags" /></div>
        <div><label>توضیح</label><input id="pDesc" /></div>
      </div>
      <button class="primary" onclick="addProduct()">افزودن</button>
    </div>
    <div class="card" style="margin-top:14px">
      <h3>📦 لیست محصولات</h3>
      <table><thead><tr><th>نام</th><th>دسته</th><th>قیمت</th><th>موجودی</th><th>وضعیت</th><th></th></tr></thead>
      <tbody id="prodBody"></tbody></table>
    </div>
  </section>

  <section id="tab-orders" class="hidden">
    <div class="card">
      <h3>🧾 سفارش‌ها</h3>
      <table><thead><tr><th>کد</th><th>مشتری</th><th>مبلغ</th><th>وضعیت</th><th>تاریخ</th></tr></thead>
      <tbody id="orderBody"></tbody></table>
    </div>
  </section>

  <section id="tab-settings" class="hidden">
    <div class="card">
      <h3>⚙️ تنظیمات</h3>
      <div class="form-grid">
        <div><label>نام فروشگاه</label><input id="sBotName" /></div>
        <div><label>هزینه ارسال</label><input id="sShip" type="number" /></div>
        <div><label>ارسال رایگان از</label><input id="sFree" type="number" /></div>
        <div><label>آیدی عددی ادمین تلگرام</label><input id="sAdmin" /></div>
        <div><label>ساعات کاری</label><input id="sHours" /></div>
        <div><label>ساعت خلاصه روزانه</label><input id="sSummary" type="number" /></div>
        <div><label>فالوآپ بعد از (ساعت)</label><input id="sFollow" type="number" /></div>
        <div><label>یادآوری سبد رهاشده (دقیقه)</label><input id="sCart" type="number" /></div>
      </div>
      <div style="margin-bottom:12px"><label>اطلاعات پرداخت</label><textarea id="sPay"></textarea></div>
      <button class="primary" onclick="saveSettings()">ذخیره</button>
      <span id="setMsg" style="color:var(--ok);font-size:12px;margin-right:10px"></span>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let currentConv = null;
let token = localStorage.getItem('adminToken') || '';

async function api(url, opts = {}) {
  const o = Object.assign({}, opts);
  o.headers = Object.assign({ 'Content-Type': 'application/json' }, o.headers || {});
  if (token) o.headers['x-admin-token'] = token;
  const res = await fetch(url, o);
  if (res.status === 401) {
    const t = prompt('توکن ادمین را وارد کن:');
    if (t) { token = t; localStorage.setItem('adminToken', t); return api(url, opts); }
    throw new Error('unauthorized');
  }
  return res.json();
}

const fmt = (n) => Number(n || 0).toLocaleString('en-US');

document.querySelectorAll('nav button').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('nav button').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    ['dash', 'chats', 'products', 'orders', 'settings'].forEach((t) => {
      $('tab-' + t).classList.toggle('hidden', t !== b.dataset.tab);
    });
    if (b.dataset.tab === 'dash') loadStats();
    if (b.dataset.tab === 'chats') loadConvs();
    if (b.dataset.tab === 'products') loadProducts();
    if (b.dataset.tab === 'orders') loadOrders();
    if (b.dataset.tab === 'settings') loadSettings();
  };
});

async function loadStats() {
  const s = await api('/api/stats');
  const cards = [
    ['سفارش امروز', fmt(s.todayOrders)],
    ['فروش امروز', fmt(s.todayRevenue) + ' ت'],
    ['کل سفارش‌ها', fmt(s.totalOrders)],
    ['کل فروش', fmt(s.totalRevenue) + ' ت'],
    ['گفتگوها', fmt(s.conversations)],
    ['نیازمند پشتیبان', fmt(s.needsHuman)],
    ['محصولات', fmt(s.products)],
    ['وضعیت تلگرام', s.telegramActive ? 'فعال ✅' : 'غیرفعال']
  ];
  $('statCards').innerHTML = cards
    .map((c) => `<div class="card"><div class="label">${c[0]}</div><div class="value">${c[1]}</div></div>`)
    .join('');
}

async function simulate() {
  const text = $('simInput').value.trim();
  if (!text) return;
  const r = await api('/api/simulate', {
    method: 'POST',
    body: JSON.stringify({ text, conversationId: currentConv })
  });
  currentConv = r.conversationId;
  $('simOut').textContent = (r.replies || []).join('\n\n');
  $('simInput').value = '';
}

async function loadConvs() {
  const list = await api('/api/conversations');
  if (!list.length) {
    $('convList').innerHTML = '<div class="empty">هنوز گفتگویی نیست</div>';
    return;
  }
  $('convList').innerHTML = list
    .map(
      (c) =>
        `<div class="conv ${c.id === currentConv ? 'active' : ''}" onclick="openConv('${c.id}')">
          <div class="n">${c.name || c.externalId} ${c.unread ? `<span class="badge b-info">${c.unread}</span>` : ''}</div>
          <div class="s">${c.channel} • ${c.handoff ? 'پشتیبان' : c.step}${c.hasCart ? ' • 🛒' : ''}</div>
        </div>`
    )
    .join('');
}

async function openConv(id) {
  currentConv = id;
  await loadConvs();
  const d = await api('/api/conversations/' + id);
  const msgs = d.messages
    .map((m) => `<div class="msg ${m.role}">${escapeHtml(m.text)}</div>`)
    .join('');
  const orders = d.orders.length
    ? `<div style="padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)">
        سفارش‌ها: ${d.orders.map((o) => `${o.id} (${fmt(o.payable)} ت)`).join(' — ')}
      </div>`
    : '';
  $('threadMsgs').innerHTML = msgs || '<div class="empty">پیامی نیست</div>';
  if (orders) $('threadMsgs').insertAdjacentHTML('beforeend', orders);
  $('threadMsgs').scrollTop = $('threadMsgs').scrollHeight;
}

async function sendReply() {
  if (!currentConv) return;
  const text = $('replyInput').value.trim();
  if (!text) return;
  await api('/api/conversations/' + currentConv + '/reply', {
    method: 'POST',
    body: JSON.stringify({ text })
  });
  $('replyInput').value = '';
  await openConv(currentConv);
}

async function toggleHandoff() {
  if (!currentConv) return;
  const d = await api('/api/conversations/' + currentConv);
  await api('/api/conversations/' + currentConv + '/handoff', {
    method: 'POST',
    body: JSON.stringify({ handoff: !d.conversation.handoff })
  });
  await openConv(currentConv);
}

async function loadProducts() {
  const list = await api('/api/products');
  $('prodBody').innerHTML = list
    .map(
      (p) => `<tr>
        <td>${escapeHtml(p.name)}</td>
        <td>${escapeHtml(p.category || '')}</td>
        <td>${fmt(p.price)}</td>
        <td>${fmt(p.stock)}</td>
        <td>${p.active ? '<span class="badge b-ok">فعال</span>' : '<span class="badge b-mut">غیرفعال</span>'}</td>
        <td><button class="danger" onclick="delProduct('${p.id}')">حذف</button></td>
      </tr>`
    )
    .join('');
}

async function addProduct() {
  const body = {
    name: $('pName').value,
    category: $('pCat').value,
    price: Number($('pPrice').value),
    stock: Number($('pStock').value),
    tags: $('pTags').value,
    description: $('pDesc').value
  };
  if (!body.name || !body.price) return alert('نام و قیمت الزامی است');
  await api('/api/products', { method: 'POST', body: JSON.stringify(body) });
  ['pName', 'pCat', 'pPrice', 'pStock', 'pTags', 'pDesc'].forEach((k) => ($(k).value = ''));
  loadProducts();
}

async function delProduct(id) {
  if (!confirm('حذف شود؟')) return;
  await api('/api/products/' + id, { method: 'DELETE' });
  loadProducts();
}

async function loadOrders() {
  const list = await api('/api/orders');
  $('orderBody').innerHTML = list.length
    ? list
        .map(
          (o) => `<tr>
            <td>${o.id}</td>
            <td>${escapeHtml(o.customer.name || '-')}<br><span style="color:var(--muted);font-size:11px">${escapeHtml(o.customer.phone || '')}</span></td>
            <td>${fmt(o.payable)}</td>
            <td>
              <select onchange="setOrderStatus('${o.id}', this.value)" style="width:auto">
                ${['new', 'confirmed', 'sent', 'delivered', 'canceled']
                  .map((s) => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${s}</option>`)
                  .join('')}
              </select>
            </td>
            <td>${new Date(o.createdAt).toLocaleString('fa-IR')}</td>
          </tr>`
        )
        .join('')
    : '<tr><td colspan="5" class="empty">سفارشی ثبت نشده</td></tr>';
}

async function setOrderStatus(id, status) {
  await api('/api/orders/' + id, { method: 'PATCH', body: JSON.stringify({ status }) });
  loadOrders();
}

async function loadSettings() {
  const s = await api('/api/settings');
  $('sBotName').value = s.botName || '';
  $('sShip').value = s.shippingCost || 0;
  $('sFree').value = s.freeShippingFrom || 0;
  $('sAdmin').value = s.adminChatId || '';
  $('sHours').value = s.workingHours || '';
  $('sSummary').value = s.dailySummaryHour || 21;
  $('sFollow').value = s.autoFollowUpHours || 24;
  $('sCart').value = s.abandonedCartMinutes || 30;
  $('sPay').value = s.paymentInfo || '';
}

async function saveSettings() {
  const body = {
    botName: $('sBotName').value,
    shippingCost: Number($('sShip').value),
    freeShippingFrom: Number($('sFree').value),
    adminChatId: $('sAdmin').value,
    workingHours: $('sHours').value,
    dailySummaryHour: Number($('sSummary').value),
    autoFollowUpHours: Number($('sFollow').value),
    abandonedCartMinutes: Number($('sCart').value),
    paymentInfo: $('sPay').value
  };
  await api('/api/settings', { method: 'PUT', body: JSON.stringify(body) });
  $('setMsg').textContent = 'ذخیره شد ✅';
  setTimeout(() => ($('setMsg').textContent = ''), 2000);
}

function escapeHtml(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

loadStats();
</script>
</body>
</html>
